# ==========================================
# Application Configuration - SmartQuiz Backend
# ==========================================
spring.application.name=smartquiz-backend
server.port=${PORT:8088}

# ==========================================
# MongoDB Database Configuration (MongoDB Atlas Cloud / Local)
# ==========================================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smartquiz_db}
spring.data.mongodb.auto-index-creation=true

# ==========================================
# File Upload / Multipart Settings (Max 15MB)
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
spring.servlet.multipart.file-size-threshold=2KB

# ==========================================
# Swagger / Springdoc OpenAPI Configuration
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true

# ==========================================
# JavaMail / SMTP Email Configuration
# ==========================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:noreply@smartquiz.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ==========================================
# JWT (JSON Web Token) Security Settings
# ==========================================
jwt.secret=SmartQuizSecretKeyForPRM393CourseProjectMustBeAtLeast256BitsLong!
jwt.expiration-ms=604800000
